databases:
  - name: airesume-db
    databaseName: ai_resume
    user: airesume_user
    plan: free
    region: oregon

services:
  # FastAPI Backend Web Service
  - type: web
    name: airesume-ats-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: airesume-db
          property: connectionString
      - key: LLM_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: BACKEND_CORS_ORIGINS
        value: '["https://airesume-ats-frontend.onrender.com", "http://localhost:5173", "http://localhost:80"]'

  # React Frontend Static Site
  - type: web
    name: airesume-ats-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://airesume-ats-backend.onrender.com
